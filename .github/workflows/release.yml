name: Release

# The build legs only build and upload artifacts; they never see a key.
# Authenticode (SignPath, once approved), the ed25519 signatures, verification
# and publishing all happen in the shared sign-and-publish workflow of
# Project-Colony-Resources, in this same run. See design/releases.md there,
# section "Shared signing workflow".

on:
  push:
    branches: [main]
  # Recovery path: finish an existing DRAFT release whose run failed. Start it
  # from the tag (`gh workflow run release.yml --ref v0.4.0 -f tag=v0.4.0`):
  # with SignPath on, sign-and-publish refuses a run whose commit is not the
  # tag's. Without a tag it only builds and smoke-tests.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release to build, sign and publish, run from that same tag (leave empty for a build-only smoke run)"
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input: when it is set, the action ignores both files.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please publishes the release before any binary exists. Held as
      # a draft; sign-and-publish refuses anything else and publishes it last.
      - name: Hold the release as a draft
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  build:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any
    # job leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: d1gg2r-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: d1gg2r-windows.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: d1gg2r-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: d1gg2r-macos-x86

    steps:
      # The tag, not the branch: the .meta sidecar binds these bytes to that
      # version. Empty on a build-only dispatch, which builds the dispatched ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          targets: ${{ matrix.target }}

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The runner has no display; --version returns before iced opens a
      # window, so this proves the binary loads and runs before it ships.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./target/${{ matrix.target }}/release/digger --version

      # SignPath checks the signed file's metadata: ProductName must be the
      # project name and ProductVersion the release. build.rs sets both.
      - name: Check the version info (Windows)
        if: runner.os == 'Windows'
        run: |
          $info = (Get-Item target\${{ matrix.target }}\release\digger.exe).VersionInfo
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "ProductName '$($info.ProductName)', ProductVersion '$($info.ProductVersion)'"
          # -cne: -ne ignores case, so winres's default 'digger' would pass.
          if ($info.ProductName -cne 'Digger' -or $info.ProductVersion -ne $version) {
            "::error::digger.exe must carry ProductName 'Digger' and ProductVersion '$version'"
            exit 1
          }

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/digger ${{ matrix.asset }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\digger.exe ${{ matrix.asset }}

      # The file at the artifact root, under its release name. The name
      # prefix is what `artifact-pattern` below matches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # Every asset gets its .sig, .meta and .meta.sig from the Project-Colony org
  # key (ed25519) over its final bytes; Colony verifies them on install and
  # refuses a tampered asset. Skipped on a build-only dispatch.
  sign-and-publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release-please.outputs.tag_name || inputs.tag) }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # main
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      assets: "d1gg2r-linux d1gg2r-windows.exe d1gg2r-macos d1gg2r-macos-x86"
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "d1gg2r"
      # Its product name must be "Digger", the ProductName build.rs gives the
      # exe (the README title), although the repository and colony.json say D1Gg2r.
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
