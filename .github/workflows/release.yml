name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild assets for (leave empty for a build-only smoke run)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: rust
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: d1gg2r-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: d1gg2r-windows.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: d1gg2r-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: d1gg2r-macos-x86

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # The runner has no display; --version returns before iced opens a
      # window, so this proves the binary loads and runs before it ships.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./target/${{ matrix.target }}/release/digger --version

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/digger ${{ matrix.asset }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\digger.exe ${{ matrix.asset }}

      - name: Upload binary to GitHub Release
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
          files: ${{ matrix.asset }}

  # Sign every release asset with the Project-Colony org key (ed25519).
  # Colony >= 0.8.0 verifies these signatures on install and REFUSES a
  # tampered asset; the job fails the release if the secret is missing so
  # an unsigned release cannot ship silently.
  sign:
    name: Sign release assets
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          gh release download "$TAG" -R "${{ github.repository }}" --dir dist
          # Metadata companions are not signable assets.
          rm -f dist/*.sig dist/*.sha256 dist/*.txt dist/*.yml dist/*.json dist/*.asc

      - name: Sign
        env:
          KEY: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::COLONY_SIGNING_KEY_PEM is not available - the release would ship unsigned."
            exit 1
          fi
          printf '%s' "$KEY" > /tmp/key.pem
          chmod 600 /tmp/key.pem
          pub=$(mktemp)
          openssl pkey -in /tmp/key.pem -pubout -out "$pub"
          for f in dist/*; do
            openssl pkeyutl -sign -inkey /tmp/key.pem -rawin -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "$f" -sigfile "$f.sig" >/dev/null
            echo "signed $(basename "$f")"
          done
          rm -f /tmp/key.pem

      - name: Upload signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # -R is not optional here. This job has no `actions/checkout`, so there
        # is no git repository for `gh` to infer the target from, and it dies
        # with "not a git repository" AFTER the assets have been signed. The
        # download step above already passes it; this one was missed, and the
        # release shipped unsigned while the job that was meant to prevent
        # exactly that reported the failure too late to stop it.
        run: gh release upload "$TAG" -R "${{ github.repository }}" dist/*.sig --clobber
