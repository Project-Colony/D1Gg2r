version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The shared signing workflow stays at the organisation pin, which moves
    # for every program at once: design/releases.md in
    # Project-Colony-Resources, "The pin". Dependabot names that dependency
    # after the workflow path, so the rule needs the trailing wildcard.
    ignore:
      - dependency-name: "Project-Colony/Project-Colony-Resources*"
    groups:
      actions-minor:
        update-types: ["minor", "patch"]
