[package]
name = "digger"
version = "0.2.1"
edition = "2021"
description = "Digger — A cross-platform system monitor with persistent history"
license = "GPL-3.0-or-later"
authors = ["MotherSphere"]
repository = "https://github.com/Project-Colony/D1Gg2r"
keywords = ["system-monitor", "sysinfo", "gui", "iced"]
categories = ["command-line-utilities", "os"]
readme = "README.md"

[dependencies]
# Shared palettes, accents, labels and the Colony/<Program>/ filesystem layout.
colony-ui = "0.1.3"
iced = { version = "0.14.0", features = ["canvas", "tokio", "image"] }
sysinfo = "0.39.6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
dirs = "6.0.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"
nvml-wrapper = { version = "0.10", optional = true }

[target.'cfg(windows)'.dependencies]
wmi = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = []
gpu = ["nvml-wrapper"]
