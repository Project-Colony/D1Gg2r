[package]
name = "digger"
version = "0.3.1"
edition = "2021"
description = "Digger — A cross-platform system monitor with persistent history"
license = "GPL-3.0-or-later"
authors = ["MotherSphere"]
repository = "https://github.com/Project-Colony/D1Gg2r"
keywords = ["system-monitor", "sysinfo", "gui", "iced"]
categories = ["command-line-utilities", "os"]
readme = "README.md"
rust-version = "1.99"

[dependencies]
# Shared palettes, accents, labels and the Colony/<Program>/ filesystem layout.
colony-ui = "0.1.6"
iced = { version = "0.14.0", features = ["canvas", "tokio", "image"] }
sysinfo = "0.40.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = "0.4.45"
dirs = "7.0.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify-rust = "4.19.0"
nvml-wrapper = { version = "0.10.0", optional = true }

[target.'cfg(windows)'.dependencies]
wmi = "0.15.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Threading",
] }

# Unconditional: build.rs decides on the target, and build dependencies are
# resolved for the host.
[build-dependencies]
winres = "0.1.12"

[features]
default = []
gpu = ["nvml-wrapper"]

[dev-dependencies]
tempfile = "3.27.0"
